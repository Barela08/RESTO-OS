name: RESTO OS CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, security-hardening]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: resto_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d resto_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Install dependencies
        run: npm ci
      - name: Typecheck and production build
        run: npm run build
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: Prepare disposable PostgreSQL fixture
        env:
          PGPASSWORD: postgres
        run: psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d resto_test -f supabase/tests/security_baseline_fixture.sql
      - name: Test security baseline migration on disposable PostgreSQL
        env:
          PGPASSWORD: postgres
        run: |
          psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d resto_test -f supabase/migrations/20261112090000_security_baseline.sql
          psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d resto_test -f supabase/tests/security_baseline_assertions.sql
