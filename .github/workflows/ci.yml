name: RESTO OS CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, security-hardening]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck and production build
        run: npm run build
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm test
